name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --group dev
      - name: Ruff
        run: uv run ruff check src/livemcp/

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor from requires-python. The remote script itself runs
        # under Ableton's embedded 3.11, which is inside this range.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync dev dependencies
        run: uv sync --group dev
      # No Ableton on a runner: these are unit tests over socket doubles, the
      # tool registry, the installer and packaging. Anything needing a live
      # Live session belongs in the bridge-gated tier, not here.
      - name: Pytest
        run: uv run pytest tests -q

  compile:
    name: remote script compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The remote script runs inside Ableton's interpreter and is never
      # imported by the server's own test run, so a syntax error in it would
      # otherwise only surface when Live loads the script.
      - name: Byte-compile remote_script
        run: python -m compileall -q remote_script/
